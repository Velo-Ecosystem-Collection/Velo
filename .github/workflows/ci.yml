name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-js:
    name: Frontend, Packages & Backend Tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: https://dummy.convex.cloud
      NEXT_PUBLIC_VELO_REGISTRY_CONTRACT_ID: CBSR5LFHR5Q2X3PO3HSMGXI43YEUYGFTHUPGNVGW6XH2VNOQUEUHIEJR
      NEXT_PUBLIC_VELO_PAY_ACCESS_CONTRACT_ID: CBHDLZYSYWETHPC6KDGH35S4SNBU5P7QWLNNDWYXJRHZMZDTQSKYVOXJ
      VELO_REQUIRE_CONTRACT_IDS: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Typecheck
        run: pnpm lint:fix

      - name: Build
        run: pnpm build

      - name: Run Tests
        run: pnpm test

      - name: Run D2 and D3 Gas Smoke Tests
        run: node --experimental-strip-types --test scripts/gas-d2-smoke.test.mjs scripts/gas-d3-smoke.test.mjs

      - name: Run D4 Gas Campaign Recorder Tests
        run: node --experimental-strip-types --test scripts/gas-d4-campaign.test.mjs scripts/convex-deployment-provenance.test.mjs

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps chromium firefox webkit

      - name: Run Three-Browser Gas Suite
        run: pnpm --filter web test:e2e:gas

      - name: Upload Gas Browser Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gas-playwright-failure-artifacts
          path: apps/web/playwright-report/gas-test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Benchmark Harness Smoke Test
        run: pnpm benchmark:smoke

  test-rust:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32v1-none

      - name: Run Cargo Tests
        run: cargo test --manifest-path contracts/registry/Cargo.toml

  deploy-convex:
    name: Deploy Convex Backend
    needs: test-js
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    concurrency:
      group: convex-production
      cancel-in-progress: false
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Convex Production Deploy Key
        shell: bash
        run: |
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "::error::CONVEX_DEPLOY_KEY is missing. Add it to the GitHub production environment or repository Actions secrets."
            exit 1
          fi

          if [[ "$CONVEX_DEPLOY_KEY" != prod:* ]]; then
            echo "::error::CONVEX_DEPLOY_KEY must be a production deploy key (its value starts with 'prod:')."
            exit 1
          fi

      - name: Build Convex Workspace Dependencies
        run: pnpm --filter @carts1024/velo-wallets build

      - name: Deploy Convex Production Backend
        run: pnpm --filter @repo/backend exec convex deploy --typecheck enable --codegen enable --message "$GITHUB_SHA"

      - name: Bind source revision to the deployed Convex target
        id: convex-deployment
        shell: bash
        env:
          EXPECTED_DEPLOYMENT_ID: prod:agreeable-salmon-748
          EXPECTED_ENVIRONMENT: production
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error::Convex deploy modified the checked-out source tree; refusing to attest a different working tree."
            exit 1
          fi

          deployment_id="$(pnpm --filter @repo/backend exec convex env get VELO_GAS_D2_DEPLOYMENT_NAME)"
          deployment_environment="$(pnpm --filter @repo/backend exec convex env get VELO_DEPLOYMENT_ENVIRONMENT)"

          if [[ "$deployment_id" != "$EXPECTED_DEPLOYMENT_ID" ]]; then
            echo "::error::The Convex deploy key did not resolve to the expected production deployment."
            exit 1
          fi
          if [[ "$deployment_environment" != "$EXPECTED_ENVIRONMENT" ]]; then
            echo "::error::The Convex production deployment environment is not configured as production."
            exit 1
          fi

          pnpm --filter @repo/backend exec convex env set --force VELO_GAS_D2_DEPLOYED_SOURCE_COMMIT "$GITHUB_SHA"
          deployed_source_commit="$(pnpm --filter @repo/backend exec convex env get VELO_GAS_D2_DEPLOYED_SOURCE_COMMIT)"
          if [[ "$deployed_source_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::The deployed source marker did not read back as the workflow commit."
            exit 1
          fi

          {
            echo "deployment_id=$deployment_id"
            echo "deployment_environment=$deployment_environment"
            echo "deployed_source_commit=$deployed_source_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Create Convex deployment evidence manifest
        env:
          CONVEX_PRODUCTION_DEPLOYMENT_ID: ${{ steps.convex-deployment.outputs.deployment_id }}
          CONVEX_PRODUCTION_DEPLOYMENT_ENVIRONMENT: ${{ steps.convex-deployment.outputs.deployment_environment }}
          CONVEX_PRODUCTION_STELLAR_NETWORK: testnet
        run: node scripts/convex-deployment-provenance.mjs create --output "$RUNNER_TEMP/convex-production-deployment.json"

      - name: Attest Convex production deployment evidence
        id: attest-convex-deployment
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/convex-production-deployment.json

      - name: Upload Convex deployment provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: convex-production-deployment-provenance
          path: |
            ${{ runner.temp }}/convex-production-deployment.json
            ${{ steps.attest-convex-deployment.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

      - name: Record Convex Deployment
        run: |
          {
            echo "### Convex production deployment"
            echo "- Commit: \`${{ steps.convex-deployment.outputs.deployed_source_commit }}\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Deployment: \`${{ steps.convex-deployment.outputs.deployment_id }}\`"
            echo "- Environment: \`${{ steps.convex-deployment.outputs.deployment_environment }}\`"
            echo "- Network: \`Testnet\`"
            echo "- Provenance: signed deployment manifest attached and uploaded as `convex-production-deployment-provenance`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-contracts:
    name: Deploy Smart Contracts
    needs: test-rust
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32v1-none

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Contracts
        run: |
          stellar contract build --manifest-path contracts/registry/Cargo.toml --locked --optimize
          stellar contract build --manifest-path contracts/pay_access/Cargo.toml --locked --optimize

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: velo-contract-wasm
          path: |
            contracts/registry/target/wasm32v1-none/release/velo_registry.wasm
            contracts/pay_access/target/wasm32v1-none/release/velo_pay_access.wasm

      - name: Deploy to Testnet
        if: env.HAS_STELLAR_SECRET_KEY == 'true'
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          stellar keys add deployer --secret-key "$STELLAR_SECRET_KEY"
          node scripts/deploy-contracts.mjs \
            --network testnet \
            --source deployer \
            --skip-tests \
            --skip-build

      - name: Upload Testnet Deployment Manifest
        if: env.HAS_STELLAR_SECRET_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testnet-contract-deployment
          path: deployments/testnet.json

      - name: Skip Testnet Deploy
        if: env.HAS_STELLAR_SECRET_KEY != 'true'
        run: echo "STELLAR_SECRET_KEY is not configured; skipping testnet deploy."
